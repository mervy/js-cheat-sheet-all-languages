<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183c36">
    <meta name="description" content="Guia de estudo interativo para dez linguagens de programação.">
    <title>Syntax Field Guide | Linguagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <style>
      :root{color-scheme:light;--ink:#192c29;--paper:#f4f5ed;--surface:#fffefa;--line:#dce2d8;--forest:#183c36;--coral:#e66c4d;--language-color:#e6b840;--mono:"DM Mono","SFMono-Regular",Consolas,monospace;--serif:"Fraunces",Georgia,serif;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none;text-rendering:optimizeLegibility}
      *{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;background:var(--paper);background-image:radial-gradient(#d9dfd4 .65px,transparent .65px);background-size:16px 16px}button,select{font:inherit}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f1a55d;outline-offset:3px}
      .sidebar{position:fixed;z-index:2;inset:0 auto 0 0;display:flex;width:260px;flex-direction:column;padding:27px 20px 20px;color:#f7f6e9;background:var(--forest)}.brand{display:flex;align-items:center;gap:11px;width:fit-content;color:inherit;text-decoration:none}.brand-mark{display:grid;width:35px;height:35px;place-items:center;border:1px solid #8bb7a0;border-radius:50%;color:#c7df81;font-family:var(--serif);font-size:21px}.brand-name{font-size:13px;font-weight:700;line-height:1.1}.brand-name span{display:block;margin-top:4px;color:#a8c0b4;font-family:var(--mono);font-size:9px;font-weight:400;text-transform:uppercase}.sidebar-rule{height:1px;margin:27px 0 25px;background:#41645d}.side-label,.language-control>span{margin:0;color:#a8c0b4;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.08em}.topic-nav{display:grid;gap:5px;margin-top:13px}.topic-link{display:flex;min-height:43px;align-items:center;gap:12px;padding:0 10px;border:1px solid transparent;border-radius:4px;color:#ccdbd2;background:transparent;text-align:left;cursor:pointer;transition:color 160ms ease,background 160ms ease}.topic-link:hover{color:#fff;background:#234a42}.topic-link[aria-current=step]{border-color:#55786b;color:#fff;background:#28554d}.topic-number{width:21px;color:#8eaaa0;font-family:var(--mono);font-size:10px}.topic-link[aria-current=step] .topic-number{color:#c7df81}.topic-name{font-size:12px;font-weight:600}.sidebar-foot{display:flex;gap:10px;align-items:flex-start;margin-top:auto;padding:14px 5px 4px;border-top:1px solid #41645d}.foot-spark{flex:0 0 8px;height:8px;margin-top:5px;border-radius:50%;background:#e6b840;box-shadow:0 0 0 4px #35584b}.sidebar-foot p{margin:0;color:#afc2b8;font-size:11px;line-height:1.7}.sidebar-foot strong{color:#fff;font-weight:500}
      .workspace{min-height:100vh;margin-left:260px}.topbar{position:sticky;z-index:1;top:0;display:flex;min-height:66px;align-items:center;justify-content:space-between;gap:20px;padding:0 5.5%;border-bottom:1px solid var(--line);background:rgb(244 245 237 / 94%);backdrop-filter:blur(12px)}.topbar-context{color:#63716a;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.04em}.status-dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#6b9a69}.context-divider{margin:0 7px;color:#a0aaa1}.language-control{display:flex;align-items:center;gap:12px}.language-control select{min-width:160px;padding:8px 30px 8px 11px;border:1px solid #cbd4ca;border-radius:3px;color:var(--ink);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer}
      .content{width:min(100%,1060px);min-height:calc(100vh - 122px);margin:0 auto;padding:45px 5.5% 30px}.intro-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;animation:arrive 320ms ease both}.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#61756b;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}.language-chip{width:8px;height:8px;border-radius:50%;background:var(--language-color)}h1{margin:0;font-family:var(--serif);font-size:clamp(38px,5vw,56px);font-weight:500;line-height:1.05}.language-summary{max-width:550px;margin:14px 0 0;color:#59665f;font-size:14px;line-height:1.75}.language-meta{display:grid;flex:0 0 142px;gap:6px;margin-top:8px;padding:12px 0 12px 16px;border-left:2px solid var(--language-color)}.language-meta span:first-child{color:#78847d;font-family:var(--mono);font-size:9px;text-transform:uppercase}.language-meta span:last-child{font-size:12px;font-weight:700}
      .study-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 0 12px;padding:13px 0;border-block:1px solid var(--line)}.topic-indicator{display:flex;align-items:center;gap:10px;color:#64716a;font-family:var(--mono);font-size:10px}.topic-indicator strong{color:var(--ink);font-weight:500}.progress-track{width:86px;height:4px;overflow:hidden;border-radius:5px;background:#dce2d8}.progress-fill{display:block;height:100%;border-radius:inherit;background:var(--coral);transition:width 180ms ease}.topic-arrows{display:flex;gap:7px}.step-button{min-height:31px;padding:0 10px;border:1px solid #cbd4ca;border-radius:3px;color:#4e5d56;background:transparent;font-size:11px;cursor:pointer}.step-button:hover:not(:disabled){border-color:#8b9c90;background:var(--surface)}.step-button:disabled{opacity:.42;cursor:not-allowed}
      .lesson{animation:arrive 320ms ease both}.lesson-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:26px 0 18px}.lesson-heading h2{margin:0;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.15}.lesson-heading p{max-width:580px;margin:8px 0 0;color:#65716c;font-size:13px;line-height:1.7}.lesson-index{padding-bottom:3px;color:#7b8780;font-family:var(--mono);font-size:9px;white-space:nowrap}.example-panel{overflow:hidden;border:1px solid #344d47;border-radius:5px;background:#172925;box-shadow:0 9px 24px rgb(26 49 41 / 9%)}.example-topline{display:flex;min-height:43px;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid #34453f;color:#aabbb0}.file-label{display:flex;min-width:0;align-items:center;gap:8px;font-family:var(--mono);font-size:10px}.file-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--language-color)}.copy-button{padding:6px 9px;border:1px solid #4b6058;border-radius:3px;color:#d9e4da;background:transparent;font-size:10px;cursor:pointer}.copy-button:hover{border-color:#88a091;background:#263a33}.code-block{min-height:190px;margin:0;padding:21px 20px 24px;overflow-x:auto;color:#e5eee3;font-family:var(--mono);font-size:12px;line-height:1.85;tab-size:4}.code-block code{font:inherit;white-space:pre}.run-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}.run-card{min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:4px;background:rgb(255 254 250 / 87%)}.run-label{display:block;margin-bottom:9px;color:#768279;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}.run-value{display:block;overflow-wrap:anywhere;color:#274a42;font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre-wrap}.output-value{color:#365eb3}.note-line{display:flex;align-items:flex-start;gap:9px;margin:17px 0 0;color:#69756e;font-size:11px;line-height:1.65}.note-mark{flex:0 0 auto;color:var(--coral);font-family:var(--mono);font-size:13px}.page-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 5.5% 20px;border-top:1px solid var(--line);color:#7b8780;font-family:var(--mono);font-size:9px}.page-footer a{color:#52675d;text-decoration-thickness:1px;text-underline-offset:3px}
      @keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:860px){.sidebar{width:218px;padding-inline:15px}.workspace{margin-left:218px}.content,.topbar{padding-inline:4%}.language-meta{flex-basis:118px}}@media(max-width:640px){.sidebar{position:relative;inset:auto;width:100%;padding:14px 16px 12px}.brand{gap:8px}.brand-mark{width:30px;height:30px;font-size:18px}.sidebar-rule,.side-label,.sidebar-foot{display:none}.topic-nav{display:flex;gap:6px;margin-top:13px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}.topic-link{min-height:35px;flex:0 0 auto;gap:7px;padding:0 9px;border-color:#41645d}.topic-number{width:auto}.topic-name{font-size:11px}.workspace{margin-left:0}.topbar{position:relative;min-height:58px;padding-inline:16px}.topbar-context{font-size:8px}.language-control{gap:7px}.language-control>span{display:none}.language-control select{min-width:125px;max-width:155px;padding:7px 24px 7px 8px;font-size:11px}.content{min-height:0;padding:30px 16px 28px}.intro-row{display:block}h1{font-size:42px}.language-summary{font-size:13px}.language-meta{display:flex;align-items:center;gap:8px;width:fit-content;margin-top:17px;padding:0 0 0 10px}.study-toolbar{margin-top:22px}.lesson-heading{align-items:flex-start}.lesson-heading h2{font-size:27px}.lesson-index{padding-top:3px}.code-block{min-height:150px;padding:17px 14px;font-size:11px}.example-topline{padding-inline:12px}.run-row{grid-template-columns:1fr;gap:8px}.run-card{padding:12px 14px}.page-footer{flex-wrap:wrap;padding:14px 16px 18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
    <style>
      /* Conteúdo das células: código, como rodar, saída, notas e links */
      .topic-note{margin:16px 0 0;padding:10px 14px;border-left:3px solid var(--coral);background:var(--surface);color:#4d5b55;font-size:12px;line-height:1.7}
      .topic-note code{font-family:var(--mono);font-size:11px;color:#274a42;background:#eef2ec;padding:1px 5px;border-radius:3px}
      .cell-content{margin-top:18px;color:#4d5b55;font-size:13px;line-height:1.8}
      .cell-content a{color:#315e52;text-decoration-thickness:1px;text-underline-offset:3px}
      .cell-content b{font-weight:600;color:#1f332d}
      .cell-content code{font-family:var(--mono);font-size:11px;color:#274a42;background:#e9eee5;padding:1px 5px;border-radius:3px}
      .cell-content pre{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#172925;color:#e5eee3;font-family:var(--mono);font-size:11px;line-height:1.6;overflow-x:auto;white-space:pre}
      .codigo{position:relative;margin:16px 0;border:1px solid #344d47;border-radius:5px;background:#172925;overflow:hidden;box-shadow:0 9px 24px rgb(26 49 41 / 9%)}
      .codigo .copiar{position:absolute;top:8px;right:8px;padding:5px 9px;border:1px solid #4b6058;border-radius:3px;color:#d9e4da;background:#263a33;font-size:10px;cursor:pointer}
      .codigo .copiar:hover{border-color:#88a091}
      .codigo pre{margin:0;padding:18px 18px 20px;color:#e5eee3;font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre;tab-size:4}
      .rodar{margin:10px 0 4px;color:#59665f;font-size:12px}
      .rodar code{font-family:var(--mono);font-size:11px;color:#274a42;background:#e9eee5;padding:1px 5px;border-radius:3px}
      .saida-titulo{margin:14px 0 6px;color:#768279;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
      pre.saida{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:#eef2ec;color:#365eb3;font-family:var(--mono);font-size:11px;line-height:1.6;overflow-x:auto;white-space:pre}
      @media (max-width:640px){.codigo pre{padding:15px 14px;font-size:11px}}
    </style>
    <script src="js/data.js" defer></script>
    <script src="js/content.js" defer></script>
    <script src="js/content-ts.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação do guia">
        <a class="brand" href="." aria-label="Syntax Field Guide, início"><span class="brand-mark" aria-hidden="true">S</span><span class="brand-name">syntax<span>field guide</span></span></a>
        <div class="sidebar-rule"></div>
        <p class="side-label">TRILHA DE ESTUDO</p>
        <nav id="topic-nav" class="topic-nav" aria-label="Tópicos"></nav>
        <div class="sidebar-foot"><span class="foot-spark" aria-hidden="true"></span><p>Um conceito por vez.<br><strong>Na linguagem que você escolher.</strong></p></div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="topbar-context"><span class="status-dot" aria-hidden="true"></span> GUIA DE REFERÊNCIA <span class="context-divider">/</span> FUNDAMENTOS</div>
          <label class="language-control" for="language-select"><span>LINGUAGEM</span><select id="language-select" aria-label="Escolher linguagem"></select></label>
        </header>
        <main id="study-content" class="content" aria-live="polite"><div class="loading-state">Preparando seu guia...</div></main>
        <footer class="page-footer"><span>SYNTAX FIELD GUIDE</span><span>10 linguagens · 20 tópicos</span><a href="https://github.com/mervy/js-cheat-sheet-all-languages" target="_blank" rel="noreferrer">Material educacional</a></footer>
      </div>
    </div>
  </body>
</html>
